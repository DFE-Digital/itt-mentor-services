name: Build and Test
concurrency: build_and_test_${{ github.ref_name }}

on: push

env:
  # undercover (test group) checks spec coverage of changed lines and depends
  # on rugged, which compiles a bundled libgit2 on install. That build fails on
  # ubuntu-26.04 runners, so each job installs libgit2-dev and rugged links
  # against it instead.
  RUGGED_USE_SYSTEM_LIBRARIES: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tests: [rubocop, erblint]
        include:
          - tests: rubocop
            command: bundle exec rubocop
          - tests: erblint
            command: bundle exec erb_lint app
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install libgit2
        run: |
          sudo apt-get update
          sudo apt-get install libgit2-dev
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: ${{ matrix.tests }}
        run: ${{ matrix.COMMAND }}

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:password@localhost:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install libgit2
        run: |
          sudo apt-get update
          sudo apt-get install libgit2-dev
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Setup PROJ
        run: |
          sudo apt-get update
          sudo apt-get install proj-bin
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: "npm"
      - name: Run RSpec tests
        run: bundle exec rails test:prepare parallel:setup zeitwerk:check parallel:spec
      - name: Upload code coverage report
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: coverage/
      - name: Detect missing code coverage
        run: bundle exec undercover --compare origin/main
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-screenshots
          path: tmp/capybara/
          if-no-files-found: ignore
